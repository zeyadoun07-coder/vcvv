<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا</title>

<style>
body{
    margin:0;
    font-family:Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:450px;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0f172a;
}

input,textarea{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
}

textarea{
    height:120px;
    resize:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#msg{
    margin-top:15px;
    text-align:center;
    color:green;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h2>📩 تواصل معنا</h2>

<form id="contactForm">

<input type="text" name="اسم المستخدم" placeholder="اسم المستخدم" required>

<input type="text" name="الكود" placeholder="الكود" required>
<input type="text" name="اسم الطالب" placeholder="اسم الطالب" required>

<input type="text" name="الصف" placeholder="الصف" required>

<input type="tel" name="رقم الهاتف" placeholder="رقم الهاتف" required>

<input type="email" name="البريد الإلكتروني" placeholder="البريد الإلكتروني" required>

<textarea name="المشكلة" placeholder="اكتب مشكلتك هنا..." required></textarea>

<button type="submit">إرسال</button>

</form>

<div id="msg"></div>

</div>

<script>
const form = document.getElementById("contactForm");

form.addEventListener("submit", async function(e){
    e.preventDefault();

    const data = new FormData(form);

    const response = await fetch(
        "https://formspree.io/f/xvzjpdbe",
        {
            method: "POST",
            body: data,
            headers:{
                'Accept':'application/json'
            }
        }
    );

    if(response.ok){
        document.getElementById("msg").innerHTML =
        "✅ تم إرسال رسالتك بنجاح، وسيتم مراجعتها قريبًا.";

        form.reset();
    }else{
        document.getElementById("msg").innerHTML =
        "❌ حدث خطأ أثناء الإرسال، حاول مرة أخرى.";
    }
});
</script>

</body>
</html>
